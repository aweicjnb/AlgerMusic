name: Build and Release

# 推送 v 开头的标签（如 v5.1.0）时构建 Windows 安装包并发布到 Releases；
# 也可以在 Actions 页面手动运行，只构建不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Read upstream release notes
        run: |
          NOTES=$(awk "/^## \[?v${{ env.VERSION }}\]?/{p=1;print;next} /^## /{p=0}p" CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release-upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            基于 [AlgerMusicPlayer](https://github.com/algerkong/AlgerMusicPlayer) v5.1.0 的个人定制版，仅 Windows x64。

            - 应用图标换成小猫咪
            - 主界面壁纸，可调界面透明度、夜间模式亮度（标题栏右上角调色板按钮）
            - 全屏歌词动画，共 7 种样式（魔法棒按钮切换，来自 Folia），可跟随字体设置
            - 去掉百度统计、打赏和作者引流内容
            - 自动更新改为从本仓库获取
            - 按 GNU AGPL v3.0 发布，源码见本仓库

            下载 `AlgerMusicPlayer-${{ env.VERSION }}-win-x64.exe` 安装即可。

            ---

            ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
